[package]
name = "sim-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sim-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.11.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
