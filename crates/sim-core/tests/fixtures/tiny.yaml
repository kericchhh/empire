name: Tiny World
calendar: { start_year: 1, periods: [Spring, Autumn] }
empires:
  - id: kingdom
    name: The Kingdom
    culture: { religion: The Old Gods }
    start: { treasury: 100, stability: 0.5 }
    regions:
      - { id: north, name: The North, start: { unrest: 0.2 } }
      - { id: south, name: The South, start: { unrest: 0.9 } }
    characters:
      - { id: queen, name: Queen Ada, title: Queen, office: head_of_state, region: north, start: { influence: 2 } }
      - { id: duke, name: Duke Bors, title: Duke, office: official, region: south, start: { influence: 0 } }
      - { id: northfolk, name: Northfolk, office: cohort, region: north }
    seats:
      - { id: crown, name: The Crown, controls: [queen] }
      - { id: rival, name: The Rival, controls: [duke] }
      - { id: folk, name: The Folk, controls: [northfolk] }
  - id: isles
    name: The Isles
    description: Raiders across the sea.
    regions:
      - { id: isle, name: The Isle }
    characters:
      - { id: pirate_king, name: King Ulf, office: head_of_state, region: isle }
      - { id: islanders, name: The Islanders, office: cohort, region: isle }
    seats:
      - { id: pirates, name: The Pirates, controls: [pirate_king, islanders] }
contacts: [[kingdom, isles]]
game_master: { id: gm, name: Game Master }
