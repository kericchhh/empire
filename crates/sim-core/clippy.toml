  { path = "std::fs::read_dir", reason = "sim-core is pure: files live in sim-server" },
  { path = "std::fs::metadata", reason = "sim-core is pure: files live in sim-server" },
  { path = "std::fs::write", reason = "sim-core is pure: files live in sim-server" },
