  { path = "std::net::UdpSocket", reason = "sim-core is pure: the network lives in sim-server" },
  { path = "rand::rngs::ThreadRng", reason = "draw only from the seeded stream: engine::roll" },
  { path = "rand::rngs::SysRng", reason = "draw only from the seeded stream: engine::roll" },
]
