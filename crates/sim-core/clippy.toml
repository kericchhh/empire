too-many-lines-threshold = 100
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iterate in a stable order: use BTreeMap" },
  { path = "std::collections::HashSet", reason = "iterate in a stable order: use BTreeSet" },
  { path = "std::time::Instant", reason = "sim-core is pure: time lives in sim-server" },
  { path = "std::time::SystemTime", reason = "sim-core is pure: time lives in sim-server" },
  { path = "std::fs::File", reason = "sim-core is pure: files live in sim-server" },
  { path = "std::fs::OpenOptions", reason = "sim-core is pure: files live in sim-server" },
  { path = "std::net::TcpStream", reason = "sim-core is pure: the network lives in sim-server" },
