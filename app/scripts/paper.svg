<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <!-- Papyrus tile, seamless (every frequency is a whole number of periods per 512px): mottling, the bands of laid strips, and their fibres over dark, smoked reed. Baked to src/paper.webp. -->
  <filter id="m"><feTurbulence type="fractalNoise" baseFrequency="0.0078125" numOctaves="4" seed="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.02 0 0 0 0 0.01 0 0 0 0 0 0 0 0 0.6 -0.2"/></filter>
  <filter id="h"><feTurbulence type="fractalNoise" baseFrequency="0.01171875 0.548828125" numOctaves="3" seed="4" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.32 0 0 0 0 0.19 0 0 0 0.26 -0.07"/></filter>
  <filter id="v"><feTurbulence type="fractalNoise" baseFrequency="0.548828125 0.01171875" numOctaves="3" seed="9" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.4 0 0 0 0 0.31 0 0 0 0 0.18 0 0 0 0.14 -0.04"/></filter>
  <filter id="hb"><feTurbulence type="fractalNoise" baseFrequency="0 0.048828125" numOctaves="2" seed="5" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.36 0 0 0 0 0.27 0 0 0 0 0.15 0 0 0 0.3 -0.1"/></filter>
  <filter id="vb"><feTurbulence type="fractalNoise" baseFrequency="0.048828125 0" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.03 0 0 0 0 0.02 0 0 0 0 0.01 0 0 0 0.8 -0.25"/></filter>
  <rect width="100%" height="100%" fill="#1f1810"/>
  <rect width="100%" height="100%" filter="url(#hb)"/>
  <rect width="100%" height="100%" filter="url(#vb)"/>
  <rect width="100%" height="100%" filter="url(#m)"/>
  <rect width="100%" height="100%" filter="url(#h)"/>
  <rect width="100%" height="100%" filter="url(#v)"/>
</svg>
