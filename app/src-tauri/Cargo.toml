[package]
name = "empire-app"
description = "Empire desktop app: watch and steer a world"
edition.workspace = true
version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
sim-core.workspace = true
sim-runner.workspace = true
sim-server = { path = "../../crates/sim-server" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.7", features = [] }
tokio = { workspace = true, features = ["sync", "net", "process", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
