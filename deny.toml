[advisories]
# Unmaintained/unsound notices do not block; vulnerabilities do.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Workspace crates are unpublished (publish = false) and carry no license.
private = { ignore = true }
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  # Weak, file-level copyleft: only changes to those crates' own files must be shared. Tauri's
  # HTML and directory dependencies (cssparser, selectors, dtoa-short, option-ext) use it.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Core rule: this project never calls a model, so no provider SDK may enter the tree.
# Agents bring their own harness; a feature that needs "the AI" becomes a seat or a tool.
deny = [
  { crate = "async-openai" },
  { crate = "openai" },
  { crate = "openai-api-rs" },
  { crate = "openai_dive" },
  { crate = "openai-api-rust" },
  { crate = "anthropic" },
  { crate = "anthropic-sdk" },
  { crate = "anthropic-ai-sdk" },
  { crate = "misanthropic" },
  { crate = "claude-sdk-rs" },
  { crate = "genai" },
  { crate = "rig-core" },
  { crate = "llm" },
  { crate = "langchain-rust" },
  { crate = "ollama-rs" },
  { crate = "mistralai-client" },
  { crate = "google-generative-ai-rs" },
  { crate = "gemini-rust" },
  { crate = "aws-sdk-bedrockruntime" },
  { crate = "aws-sdk-bedrockagentruntime" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
