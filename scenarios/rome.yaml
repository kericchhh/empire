name: Rome and Parthia under the First Princeps
description: >
  27 BC. The civil wars are over and Octavian, now hailed Augustus, holds power behind the
  forms of the old Republic. In the east, the Parthian King of Kings Phraates IV still holds
  the eagles taken from Crassus, while a pretender backed by Roman money waits for his chance.
  Two great powers face each other across the Euphrates.

calendar:
  start_year: -27
  periods: [Spring, Summer, Autumn, Winter]
  negative_suffix: BC
  positive_suffix: AD

theme:
  palette: ["#7a1f1f", "#c9a227", "#f3e9d2", "#2b2118"]
  font_display: Cinzel
  font_body: EB Garamond
  terms:
    currency: denarii
    region: province

empires:
  - id: rome
    name: Rome
    description: The Roman state, master of the Mediterranean from Hispania to Egypt.
    culture:
      religion: Roman polytheism; the cult of the deified Julius is rising
      ideology: Republican institutions in form, rule by one man in practice
      values: piety, honour, lineage, duty to the state, glory in conquest
      lifestyle: Patrician households and clients in the city, farmers and slaves on the land
    start: { treasury: 400, stability: 0.6, legitimacy: 0.55, military: 0.7, culture: 0.4 }
    regions:
      - id: italia
        name: Italia
        description: The heartland. Rome itself, a million mouths fed on imported grain.
        start: { population: 7, wealth: 0.85, food: 0.5, fertility: 0.6, unrest: 0.25, frontier: 0 }
      - id: gallia
        name: Gallia
        description: Recently conquered, still restless, rich in farmland.
        start: { population: 6, wealth: 0.45, fertility: 1.0, unrest: 0.35, frontier: 0 }
      - id: hispania
        name: Hispania
        description: Silver mines and mountain tribes not yet subdued.
        start: { population: 4, wealth: 0.55, unrest: 0.3, frontier: 0.3 }
      - id: aegyptus
        name: Aegyptus
        description: The Princeps' personal domain and the granary of Rome.
        start: { population: 5, wealth: 0.7, food: 0.8, fertility: 1.6, frontier: 0 }
      - id: germania
        name: Germania frontier
        description: The Rhine border, where the legions face the free tribes.
        start: { population: 1.5, wealth: 0.25, unrest: 0.3, fertility: 0.7, frontier: 1 }
    characters:
      - id: augustus
        name: Gaius Julius Caesar Augustus
        title: Princeps
        office: head_of_state
        region: italia
        persona: Cautious, patient, image-obsessed. Prefers the appearance of restored Republic to open monarchy.
        goals: [Secure the succession, Keep the Senate pacified, Keep Rome fed, Recover the eagles of Crassus]
        secrets: [His health is failing; he fears dying before an heir is ready]
        start: { influence: 10, fortune: 200 }
      - id: agrippa
        name: Marcus Vipsanius Agrippa
        title: Legate
        office: commander
        region: italia
        persona: Blunt, loyal, brilliant in war and engineering. Disdains senatorial snobbery.
        goals: [Pacify Hispania, Keep the legions loyal to Augustus]
        secrets: [Some officers would back him over Augustus if offered]
        start: { influence: 6, fortune: 60 }
      - id: piso
        name: Gnaeus Calpurnius Piso
        title: Senator
        office: official
        region: italia
        persona: Proud republican aristocrat who fought against Caesar. Sharp-tongued, principled, ambitious.
        goals: [Restore real power to the Senate, Win a consulship]
        secrets: [Corresponds with exiled republicans]
        start: { influence: 3, fortune: 20 }
      - id: sestius
        name: Lucius Sestius
        title: Senator
        office: official
        region: italia
        persona: Pragmatic survivor. Supports whoever wins, collects favours from everyone.
        goals: [Grow his fortune, Stay on the winning side]
        start: { influence: 3, fortune: 50 }
      - id: virgil
        name: Publius Vergilius Maro
        title: Poet
        office: private
        region: italia
        persona: Shy, melancholic, devoted to his craft. Writing an epic of Rome's founding.
        goals: [Finish the Aeneid, Keep his patron's favour without betraying his art]
        start: { influence: 3, fortune: 20 }
      - id: plebs_rome
        name: The plebs of Italia
        office: cohort
        region: italia
        persona: Crowded, hungry, proud of Rome. Loyal to whoever feeds and entertains them.
        goals: [Bread, games, safety]
      - id: farmers_gaul
        name: The farmers of Gallia
        office: cohort
        region: gallia
        persona: Conquered within living memory. Taxed, resentful, slowly learning Roman ways.
        goals: [Keep their land, Pay less tribute]
      - id: fellahin_egypt
        name: The farmers of Aegyptus
        office: cohort
        region: aegyptus
        persona: Ancient, patient, ruled by a succession of foreign masters. The Nile flood is everything.
        goals: [A good flood, Fair grain prices]
    seats:
      - { id: princeps, name: The Princeps, controls: [augustus] }
      - { id: senate, name: The Senate, controls: [piso, sestius] }
      - { id: legate, name: The Legate, controls: [agrippa] }
      - { id: poet, name: The Poet, controls: [virgil] }
      - { id: people, name: The People, controls: [plebs_rome, farmers_gaul, fellahin_egypt] }

  # Parthia sets no starting numbers: the engine draws them from the seed.
  - id: parthia
    name: Parthia
    description: The Arsacid realm of the King of Kings, from the Euphrates to the Indus.
    culture:
      religion: Zoroastrian fire temples beside Greek and Babylonian gods
      ideology: A King of Kings above great noble houses that can make and unmake kings
      values: horsemanship, archery, lineage, hospitality, loyalty to one's house
      lifestyle: Mounted nobles on great estates, Greek cities, Babylonian farmers along the rivers
    regions:
      - id: mesopotamia
        name: Mesopotamia
        description: The rich river lands around Ctesiphon and Seleucia, facing Roman Syria.
      - id: media
        name: Media
        description: Highlands and horse pastures; the summer seat of kings.
      - id: parthava
        name: Parthava
        description: The ancestral homeland in the northeast, open to the nomads of the steppe.
    characters:
      - id: phraates
        name: Phraates IV
        title: King of Kings
        office: head_of_state
        region: mesopotamia
        persona: Ruthless and suspicious. Murdered his father and brothers for the throne, and fears the same fate.
        goals: [Crush the pretender, Keep the great houses loyal, Keep Rome beyond the Euphrates]
        secrets: [He would trade the eagles of Crassus for the safety of his throne]
      - id: suren
        name: Head of the House of Suren
        title: Spahbed
        office: commander
        region: media
        persona: Proud heir of the general who destroyed Crassus. Loyal to the throne while it honours his house.
        goals: [Win glory against Rome, Keep his house first among the nobles]
      - id: tiridates
        name: Tiridates
        title: Pretender
        office: private
        region: mesopotamia
        persona: A noble who once seized the throne and lost it. Charming, reckless, courting Rome for help.
        goals: [Take the throne, Win Roman support]
        secrets: [He has promised Augustus the eagles in return for Roman backing]
      - id: farmers_mesopotamia
        name: The farmers of Mesopotamia
        office: cohort
        region: mesopotamia
        persona: Babylonian villagers who have outlasted every empire. Canals and harvests matter more than kings.
        goals: [Peaceful canals, Fair dues]
    seats:
      - { id: parthia, name: The King of Kings, controls: [phraates, suren] }
      - { id: pretender, name: The Pretender, controls: [tiridates] }
      - { id: villages, name: The Villages, controls: [farmers_mesopotamia] }

game_master: { id: gm, name: Game Master }
