name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  INSTA_UPDATE: "no"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo nextest run --workspace --locked --no-tests=fail
      - run: cargo test --workspace --doc --locked
      - name: Bindings are up to date
        run: |
          stale=$(git status --porcelain -- app/src/bindings)
          [ -z "$stale" ] || { echo "::error::app/src/bindings is stale: run 'cargo test -p empire-app bindings' and commit it:"; echo "$stale"; exit 1; }
      - name: Smoke test control CLI
        run: |
          state="${TMPDIR:-/tmp}/empire-ci-$RANDOM"
          trap 'EMPIRE_STATE_DIR="$state" scripts/empire stop >/dev/null 2>&1 || true; rm -rf "$state"' EXIT
          export EMPIRE_STATE_DIR="$state"
          scripts/empire start --scenario scenarios/rome.yaml --tick-seconds 2
          scripts/empire doctor | jq -e '.status == "healthy"'
          scripts/empire tool princeps look '{}' | jq -e '.perception.seat == "princeps"'
          scripts/empire tick 1 | jq -e '.closed == [1]'
          ! scripts/empire tool princeps nosuchtool '{}'
          scripts/empire stop
      - name: No pending snapshots
        run: |
          pending=$(find . -path ./target -prune -o \( -name '*.snap.new' -o -name '*.pending-snap' \) -print)
          [ -z "$pending" ] || { echo "::error::pending insta snapshots:"; echo "$pending"; exit 1; }

  macos-sandbox:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo test -p sim-runner -p sim-server --locked

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo doc --workspace --no-deps --locked

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo run --locked --quiet -p sim-server -- schema > schema/scenario.schema.json
      - name: Schema is up to date
        run: |
          git diff --exit-code --stat -- schema/ \
            || { echo "::error::schema/scenario.schema.json is stale: run 'cargo run -p sim-server -- schema > schema/scenario.schema.json' and commit it"; exit 1; }

  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec check-jsonschema==0.39.0 check-jsonschema --schemafile schema/scenario.schema.json scenarios/*.yaml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes pnpm@10.33.0 install --frozen-lockfile
      - run: npx --yes pnpm@10.33.0 build

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22
      - run: cargo deny --locked check

  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: scripts/test-pr-check
      - if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/pr-check ${{ github.event.pull_request.number }}

  ci-success:
    if: ${{ always() }}
    needs: [fmt, clippy, test, macos-sandbox, doc, schema, scenarios, frontend, deny, pr]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*|*" skipped "*) exit 1 ;;
          esac
