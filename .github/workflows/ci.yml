# CI for what is built today: the Rust workspace (the sim crates and the Tauri app's backend),
# the app's frontend, the generated scenario schema and the scenario files. Rust jobs use
# --workspace, so adding a crate needs no edit here.
#
# Branch protection: require only the `ci-success` check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Never rewrite snapshots in CI: a diff or an unreferenced snapshot must fail.
  INSTA_UPDATE: "no"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9
      # Includes the golden-run snapshots, the replay-invariant proptest and the MCP/HTTP e2e tests.
      - run: cargo nextest run --workspace --locked --no-tests=fail
      # nextest does not run doctests.
      - run: cargo test --workspace --doc --locked
      - name: No pending snapshots
        run: |
          pending=$(find . -path ./target -prune -o \( -name '*.snap.new' -o -name '*.pending-snap' \) -print)
          [ -z "$pending" ] || { echo "::error::pending insta snapshots:"; echo "$pending"; exit 1; }

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo doc --workspace --no-deps --locked

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo run --locked --quiet -p sim-server -- schema > schema/scenario.schema.json
      - name: Schema is up to date
        run: |
          git diff --exit-code --stat -- schema/ \
            || { echo "::error::schema/scenario.schema.json is stale: run 'cargo run -p sim-server -- schema > schema/scenario.schema.json' and commit it"; exit 1; }

  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec check-jsonschema==0.39.0 check-jsonschema --schemafile schema/scenario.schema.json scenarios/*.yaml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Type-checks with tsc, then bundles with Vite.
      - run: npx --yes pnpm@10.33.0 install --frozen-lockfile
      - run: npx --yes pnpm@10.33.0 build

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22
      - run: cargo deny --locked check

  ci-success:
    if: ${{ always() }}
    needs: [fmt, clippy, test, doc, schema, scenarios, frontend, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*|*" skipped "*) exit 1 ;;
          esac
