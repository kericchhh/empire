name: Rust setup
description: >-
  Install the toolchain pinned by rust-toolchain.toml, the system libraries the Tauri app links
  against, and restore the cargo cache.
runs:
  using: composite
  steps:
    - name: Install system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev
    - name: Install toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
