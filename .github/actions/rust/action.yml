name: Rust setup
description: Install the toolchain pinned by rust-toolchain.toml and restore the cargo cache.
runs:
  using: composite
  steps:
    # Install before rust-cache: the cache key includes the rustc version.
    - name: Install toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # PRs restore main's cache but never write one, so they cannot evict it.
        save-if: ${{ github.ref == 'refs/heads/main' }}
